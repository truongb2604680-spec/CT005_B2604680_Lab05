<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infographic và video - Nhiệm vụ 2.2</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        line-height: 1.6;
        color: #1f2937;
        background: #f3f4f6;
      }
      main {
        width: min(100% - 32px, 1000px);
        margin: 32px auto;
        padding: 28px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 16px #00000018;
      }
      h1 {
        margin-top: 0;
        color: #166534;
      }
      h2 {
        color: #1d4ed8;
        margin-top: 28px;
      }
      .infographic {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 16px auto;
        border: 1px solid #d1d5db;
      }
      .video {
        position: relative;
        width: 100%;
        padding-bottom: 56.25%;
        overflow: hidden;
        border-radius: 8px;
      }
      .video iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      footer {
        margin-top: 28px;
        padding-top: 16px;
        border-top: 1px solid #d1d5db;
        color: #6b7280;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Infographic và video Nhiệm vụ 2.2</h1>
      <p>
        Trang trình bày infographic của bài học và video hướng dẫn thực hiện
        Nhiệm vụ 2.2.
      </p>

      <h2>Infographic</h2>
      <img
        class="infographic"
        src="Lab05_Ex2.1.png"
        alt="Infographic của bài tập Lab 05, nhiệm vụ 2.1"
      />

      <h2>Video hướng dẫn Nhiệm vụ 2.2</h2>
      <div class="video">
        <iframe
          src="https://www.youtube.com/embed/3sdzIYYVGMw"
          allowfullscreen
        ></iframe>
      </div>

      <footer>
        &copy; 2025 CT005_B2604680. Nội dung và hình ảnh được sử dụng cho mục
        đích học tập.
      </footer>
    </main>
  </body>
</html>
